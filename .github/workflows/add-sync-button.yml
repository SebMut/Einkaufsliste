name: Sync-Button in Webseite einbauen

on:
  push:
    paths:
      - '.github/workflows/add-sync-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manuellen Sync-Button einbauen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_old = '.brand b{display:block}.brand small,.muted{color:var(--muted)}.ver{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px}'
          css_new = '.brand b{display:block}.brand small,.muted{color:var(--muted)}.headerActions{display:flex;align-items:center;gap:7px;flex-shrink:0}.ver{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px}.syncBtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:99px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px #0b6b4f22}.syncBtn:active{transform:scale(.97)}'
          if css_old not in s and '.syncBtn{' not in s:
              raise SystemExit('CSS-Anker nicht gefunden')
          if '.syncBtn{' not in s:
              s = s.replace(css_old, css_new, 1)

          header_old = '<header><div class="brand"><div class="logo">🛒</div><div><b>AngebotsRadar</b><small>Feldkirchen · Heimstetten · Aschheim · Kirchheim · Riem Arcaden</small></div></div><span class="ver">V5.1 · strikt lokal</span></header>'
          header_new = '<header><div class="brand"><div class="logo">🛒</div><div><b>AngebotsRadar</b><small>Feldkirchen · Heimstetten · Aschheim · Kirchheim · Riem Arcaden</small></div></div><div class="headerActions"><a id="manualSync" class="syncBtn" href="https://github.com/SebMut/Einkaufsliste/actions/workflows/full-database-refresh.yml" target="_blank" rel="noopener" title="Kompletten Datenbank-Refresh manuell starten">🔄 Sync</a><span class="ver">V5.1 · strikt lokal</span></div></header>'
          if header_old not in s and 'id="manualSync"' not in s:
              raise SystemExit('Header-Anker nicht gefunden')
          if 'id="manualSync"' not in s:
              s = s.replace(header_old, header_new, 1)

          # Auf kleinen Displays bleibt der Sync-Button sichtbar; nur die Versionsplakette wird ausgeblendet.
          p.write_text(s, encoding='utf-8')
          PY

      - name: Änderung prüfen
        run: |
          grep -q 'id="manualSync"' index.html
          grep -q 'full-database-refresh.yml' index.html
          grep -q '.syncBtn' index.html

      - name: Committen
        shell: bash
        run: |
          git config user.name "AngebotsRadar UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sync-Button ist bereits vorhanden."
            exit 0
          fi
          git commit -m "Manuellen Sync-Button oben einbauen [skip ci]"
          git pull --rebase origin main
          git push origin main
