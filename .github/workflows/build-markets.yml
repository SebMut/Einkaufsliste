name: Marktkatalog aktualisieren

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/market-catalog/**'
      - 'importer/build-markets.js'
      - '.github/workflows/build-markets.yml'

permissions:
  contents: write

concurrency:
  group: market-catalog-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: markets.json erzeugen und validieren
        working-directory: importer
        run: node build-markets.js
      - name: Marktkatalog veröffentlichen
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Marktkatalog 15 km aktualisieren"
          git pull --rebase origin main
          git push origin main
