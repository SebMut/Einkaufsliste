name: Reader-Reparatur 403-Quellen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reader-repair.yml'

permissions:
  contents: write

concurrency:
  group: reader-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: REWE EDEKA METRO Reader
        working-directory: importer
        shell: bash
        run: |
          set -o pipefail
          node reader-fallback.js 2>&1 | tee ../data/reader-repair.log

      - name: Netto Reader
        working-directory: importer
        shell: bash
        run: |
          set -o pipefail
          node netto-reader.js 2>&1 | tee -a ../data/reader-repair.log

      - name: Qualitätsprüfung Stufe 1
        working-directory: importer
        shell: bash
        run: |
          set -o pipefail
          node sanitize.js 2>&1 | tee -a ../data/reader-repair.log

      - name: Qualitätsprüfung Stufe 2
        working-directory: importer
        shell: bash
        run: |
          set -o pipefail
          node quality-v2.js 2>&1 | tee -a ../data/reader-repair.log

      - name: Ergebnisübersicht
        shell: bash
        run: |
          node - <<'NODE' | tee -a data/reader-repair.log
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/offers-live.json','utf8'));
          const q=JSON.parse(fs.readFileSync('data/quality-report.json','utf8'));
          for(const s of d.sources||[]) console.log(`${s.store}: ${s.status} / ${s.count||0} / ${s.message||''}`);
          console.log(`Gesamt: ${d.offerCount||0}`);
          console.log(`Stufe 1: ${q.before} -> ${q.after}; verworfen=${q.rejected}; repariert=${q.repaired}`);
          if(q.finalPass) console.log(`Stufe 2: ${q.finalPass.before} -> ${q.finalPass.after}; verworfen=${q.finalPass.rejected}`);
          NODE

      - name: Reparierte Live-Daten veröffentlichen
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers-live.json data/reader-repair.log data/quality-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Streng geprüfte Angebotsdaten aktualisieren"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 3
          done
          exit 1
