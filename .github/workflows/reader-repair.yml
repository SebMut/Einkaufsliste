name: Reader-Reparatur Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-repair-diagnostic
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Ausgangsstand testen
        working-directory: importer
        run: npm test
      - name: REWE EDEKA METRO Reader
        working-directory: importer
        run: node reader-fallback.js
      - name: Netto Reader V2
        working-directory: importer
        run: node netto-reader-v2.js
      - name: Qualitätsprüfung Stufe 1
        working-directory: importer
        run: node sanitize.js
      - name: Qualitätsprüfung Stufe 2
        working-directory: importer
        run: node quality-v2.js
      - name: Qualitätsprüfung Stufe 3
        working-directory: importer
        run: node quality-v3.js
      - name: Qualitätsprüfung Stufe 4 Semantik
        working-directory: importer
        run: node quality-v4.js
      - name: Marktgrenze und Katalog anwenden
        working-directory: importer
        run: npm run merge
      - name: Reparierten Arbeitsstand erneut testen
        working-directory: importer
        run: npm test
      - name: Ergebnisübersicht
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/offers-live.json','utf8'));
          const q=JSON.parse(fs.readFileSync('data/quality-report.json','utf8'));
          for(const s of d.sources||[]) console.log(`${s.store}: ${s.status} / ${s.count||0} / ${s.message||''}`);
          console.log(`Gesamt: ${d.productCount||d.offerCount||0}`);
          console.log(`Stufe 1: ${q.before} -> ${q.after}; verworfen=${q.rejected}; repariert=${q.repaired}`);
          if(q.finalPass) console.log(`Stufe 2: ${q.finalPass.before} -> ${q.finalPass.after}; verworfen=${q.finalPass.rejected}; repariert=${q.finalPass.repaired||0}`);
          console.log('Diagnosemodus: Es werden bewusst keine Produktionsdaten committed.');
          NODE
