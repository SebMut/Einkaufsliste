name: Vollständige Test-Suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'importer/**'
      - 'scripts/fix-product-visibility.mjs'
      - '.github/workflows/test-suite.yml'

permissions:
  contents: write

concurrency:
  group: complete-test-suite
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Konkrete Produktdarstellung sicherstellen
        run: |
          if grep -q 'concreteKeyOf=o=>o.canonicalProductId' index.html; then
            echo 'Bereits aktiv.'
          else
            node scripts/fix-product-visibility.mjs
          fi
      - name: Gefundenen Semantik-Randfall idempotent korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('importer/semantic-products.js')
          s=p.read_text()
          old=r"/spülmaschinen(?:tabs?|tabletten)|geschirrspül(?:tabs?|tabletten)|spülmaschinentabs?/"
          new=r"/spülmaschinen\s*(?:tabs?|tabletten)|geschirrspül\s*(?:tabs?|tabletten)|spülmaschinentabs?/"
          if old in s:
              p.write_text(s.replace(old,new,1))
              print('Semantikfix angewendet.')
          elif new in s:
              print('Semantikfix bereits vorhanden.')
          else:
              raise SystemExit('Erwartete Semantikregel nicht gefunden; keine unsichere Änderung durchgeführt.')
          PY
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Sortiments-Abdeckung auditieren
        working-directory: importer
        run: npm run audit:assortment
      - name: Automatisierte Tests ausführen
        id: tests
        working-directory: importer
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../test-output.tap
          CODE=${PIPESTATUS[0]}
          TESTS=$(awk '/^# tests /{v=$3} END{print v+0}' ../test-output.tap)
          PASS=$(awk '/^# pass /{v=$3} END{print v+0}' ../test-output.tap)
          FAIL=$(awk '/^# fail /{v=$3} END{print v+0}' ../test-output.tap)
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Testquittung erzeugen
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          TESTS: ${{ steps.tests.outputs.tests }}
          PASS: ${{ steps.tests.outputs.pass }}
          FAIL: ${{ steps.tests.outputs.fail }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs');
          const receipt={schema:1,generatedAt:new Date().toISOString(),testedCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,node:process.version,status:Number(process.env.EXIT_CODE)===0?'passed':'failed',tests:Number(process.env.TESTS||0),passed:Number(process.env.PASS||0),failed:Number(process.env.FAIL||0),exitCode:Number(process.env.EXIT_CODE||99)};
          fs.writeFileSync('docs/test-results.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          cp test-output.tap docs/test-output.tap
      - name: Korrektur, Audit und Testquittung veröffentlichen
        if: always()
        shell: bash
        run: |
          git config user.name "AngebotsRadar Test Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html importer/frontend-smoke.test.js importer/semantic-products.js docs/test-results.json docs/test-output.tap docs/assortment-audit.json docs/assortment-audit.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sortiments-Audit und Testquittung aktualisieren [skip ci]"
          git pull --rebase origin main
          git push origin main
      - name: Teststatus bewerten
        if: always()
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"
