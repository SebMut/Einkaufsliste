name: Lidl Prospektseitenprobe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/lidl-pages-summary.mjs'
      - '.github/workflows/lidl-pages-summary.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seiten extrahieren
        run: node tools/lidl-pages-summary.mjs
      - name: Publish
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lidl-pages-summary.json
          git commit -m "Lidl Prospektseiten aktualisieren" || exit 0
          git pull --rebase origin main
          git push origin main
