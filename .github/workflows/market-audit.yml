name: Markt-Audit 15 km

on:
  workflow_dispatch:
  push:
    paths:
      - 'importer/market-audit-v2.js'
      - '.github/workflows/market-audit.yml'

permissions:
  contents: write

concurrency:
  group: market-audit-15km
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Märkte im 15-km-Radius neu ermitteln
        id: audit
        working-directory: importer
        shell: bash
        run: |
          set +e
          node market-audit-v2.js 2>&1 | tee ../data/market-audit.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ergebnisse oder Fehlerlog veröffentlichen
        if: always()
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          touch data/market-audit.log
          git add data/market-audit.log
          [ -f data/markets.json ] && git add data/markets.json
          [ -f data/market-audit-report.json ] && git add data/market-audit-report.json
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.audit.outputs.exit_code }}" = "0" ]; then MSG="Markt-Audit 15 km V2 aktualisieren"; else MSG="Markt-Audit V2 Fehlerdiagnose aktualisieren"; fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 4
          done
          exit 1

      - name: Auditstatus bewerten
        if: always()
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
