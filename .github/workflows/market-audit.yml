name: Markt-Whitelist Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-whitelist-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Markt-Policy und Produktlogik testen
        working-directory: importer
        run: npm test
      - name: Aktive Märkte strikt validieren
        working-directory: importer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {isAllowedMarket} from './market-policy.js';
          const data=JSON.parse(fs.readFileSync('../data/markets.json','utf8'));
          const markets=data.markets||[];
          const bad=markets.filter(m=>!isAllowedMarket(m));
          const invalidRiem=markets.filter(m=>/riem/i.test(`${m.market||''} ${m.address||''}`)&&!m.isRiemArcaden);
          if(bad.length||invalidRiem.length){
            console.error('Unerlaubte Märkte:', bad);
            console.error('Ungültige Riem-Einträge:', invalidRiem);
            process.exit(1);
          }
          console.log(`Whitelist korrekt: ${markets.length} aktive Filialen.`);
          NODE
      - name: Sicherstellen, dass kein 15-km-Produktionsworkflow zurückkehrt
        run: |
          if grep -RniE 'Markt-Audit 15 km|RADIUS_KM=15|15-km-radius' .github/workflows importer --exclude=market-audit-v2.js; then
            echo 'Veraltete 15-km-Produktionslogik gefunden.'
            exit 1
          fi
          echo 'Keine aktive 15-km-Produktionslogik gefunden.'
