name: Homepage v7 anwenden

on:
  push:
    paths:
      - '.github/workflows/apply-homepage-v7.yml'
      - 'scripts/simplify-homepage.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Homepage bereinigen
        run: node scripts/simplify-homepage.mjs
      - name: Änderungen veröffentlichen
        shell: bash
        run: |
          git config user.name "AngebotsRadar UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Homepage übersichtlicher machen und Cache erneuern [skip ci]"
          git pull --rebase origin main
          git push origin main
