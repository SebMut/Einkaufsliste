name: Live-Angebote importieren (Legacy)

# Dieser Workflow bleibt nur als Hinweis erhalten, damit alte Links in GitHub
# Actions nicht ins Leere laufen. Der produktive Import läuft ausschließlich
# über import-offers-v41.yml. Dadurch können alte Parser keine neuen Live-Daten
# mehr überschreiben.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Hinweis
        run: |
          echo "Legacy-Workflow deaktiviert."
          echo "Bitte 'Live-Angebote importieren V4.1' verwenden."
