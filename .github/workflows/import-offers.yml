name: Live-Angebote importieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  push:
    paths:
      - 'importer/**'
      - 'data/markets.json'
      - '.github/workflows/import-offers.yml'

permissions:
  contents: write

concurrency:
  group: live-offers-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencies installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Chromium installieren
        working-directory: importer
        run: npx playwright install --with-deps chromium
      - name: Aktuelle Angebote importieren
        working-directory: importer
        run: npm run import
      - name: Live-Daten veröffentlichen
        run: |
          if git diff --quiet -- data/offers-live.json; then
            echo "Keine Änderung an den Angebotsdaten."
            exit 0
          fi
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers-live.json
          git commit -m "Live-Angebote aktualisieren"
          git push
