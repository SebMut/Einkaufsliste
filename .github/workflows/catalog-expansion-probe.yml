name: Sortimentserweiterung prüfen
on:
  workflow_dispatch:
  push:
    paths:
      - 'importer/catalog-expansion-probe.js'
      - '.github/workflows/catalog-expansion-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sortimentsschnittstellen prüfen
        working-directory: importer
        run: node catalog-expansion-probe.js
      - name: Ergebnis veröffentlichen
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalog-expansion-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sortimentsprobe aktualisieren [skip ci]"
          git pull --rebase origin main
          git push origin main
