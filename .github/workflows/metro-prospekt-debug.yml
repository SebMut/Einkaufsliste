name: METRO Prospekt Debug

on:
  workflow_dispatch:
  push:
    paths:
      - 'importer/metro-prospekt.js'
      - '.github/workflows/metro-prospekt-debug.yml'

permissions:
  contents: write

concurrency:
  group: metro-prospekt-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencies installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: PDF Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: METRO Parser Dry Run
        working-directory: importer
        env:
          METRO_PREVIEW: '1'
        shell: bash
        run: |
          set +e
          : > ../data/metro-preview-run.log
          node metro-prospekt.js >> ../data/metro-preview-run.log 2>&1
          CODE=$?
          echo "PARSER_EXIT=$CODE" >> ../data/metro-preview-run.log
          exit 0
      - name: Vorschau veröffentlichen
        if: always()
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          touch data/metro-preview-run.log
          git add data/metro-preview-run.log
          if [ -f data/metro-prospekt-preview.json ]; then git add data/metro-prospekt-preview.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "METRO Prospekt-Diagnose aktualisieren"
          git pull --rebase origin main
          git push origin main
