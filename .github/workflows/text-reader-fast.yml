name: Textreader Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Tests vor Reader
        working-directory: importer
        run: npm test
      - name: HIT und Kaufland Textreader diagnostisch ausführen
        continue-on-error: true
        working-directory: importer
        run: |
          node text-retailers.js
          node hit-reader-v4.js
      - name: Qualitätskette und Markt-Guard
        working-directory: importer
        run: |
          node sanitize.js
          node quality-v2.js
          node quality-v3.js
          node quality-v4.js
          npm run merge
      - name: Ergebnis erneut testen
        working-directory: importer
        run: npm test
      - name: Hinweis
        run: echo 'Diagnosemodus; dieser Workflow schreibt keine Produktionsdaten ins Repository.'
