name: Semantikfix Butterkeks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/semantic-fix-butterkeks.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Butterkeks vor Milch klassifizieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('importer/semantic-products.js')
          s=p.read_text()
          if "Butterkeks kann z. B. Vollmilchschokolade" in s:
              print('Fix bereits vorhanden')
              raise SystemExit(0)
          block="""  else if (/butterkeks/.test(n)) p = profile('Butterkeks', {
            department: 'Lebensmittel', category: 'Süßes & Snacks', subcategory: 'Kekse',
            marketSection: 'Süßes & Snacks', canonicalGroup: 'Kekse', canonicalProduct: 'Butterkeks',
            bundleKey: 'Butterkeks', semanticType: 'Butterkeks', useCase: 'Keks/Süßware'
          });
"""
          if block not in s:
              raise SystemExit('Butterkeks-Block nicht gefunden')
          s=s.replace(block,'',1)
          marker='  // Milch-Wortfamilie: gleiche Buchstaben bedeuten nicht dasselbe Produkt.\n'
          if marker not in s:
              raise SystemExit('Milch-Marker nicht gefunden')
          s=s.replace(marker,"  // Butterkeks kann z. B. Vollmilchschokolade enthalten und muss vor Trinkmilch geprüft werden.\n"+block+'\n'+marker,1)
          p.write_text(s)
          PY
          node --check importer/semantic-products.js
      - name: Fix veröffentlichen
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add importer/semantic-products.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Butterkeks mit Vollmilch korrekt klassifizieren"
          git pull --rebase origin main
          git push origin main
