name: UI Händlertyp-Filter Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Aktuelles Frontend und Produktlogik testen
        working-directory: importer
        run: npm test
      - name: Legacy-Patcher nur im Arbeitsverzeichnis prüfen
        run: |
          node scripts/patch-market-type-filter.mjs
          echo 'Der Workflow ist absichtlich read-only und veröffentlicht keine automatischen UI-Patches.'
