name: UI Händlertyp-Filter

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-market-type-filter.mjs'
      - '.github/workflows/ui-market-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend patchen
        run: node scripts/patch-market-type-filter.mjs
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "V4.6 Händlertyp-Filter und Marktinventur" || exit 0
          git pull --rebase origin main
          git push origin main
