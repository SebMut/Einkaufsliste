name: Homepage vereinfachen

on:
  push:
    paths:
      - 'scripts/simplify-homepage.mjs'
      - '.github/workflows/simplify-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Homepage aufräumen
        run: node scripts/simplify-homepage.mjs
      - name: Änderung veröffentlichen
        run: |
          git config user.name "AngebotsRadar UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- index.html
          git diff --cached --quiet && exit 0
          git commit -m "Homepage übersichtlicher gestalten [skip ci]"
          git pull --rebase origin main
          git push origin main
