name: Spezialreader Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rich-reader-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Tests vor Spezialreader
        working-directory: importer
        run: npm test
      - name: Chromium installieren
        working-directory: importer
        run: npx playwright install --with-deps chromium
      - name: Spezialreader im Arbeitsverzeichnis ausführen
        working-directory: importer
        run: node rich-retailers.js
      - name: Qualitätskette
        working-directory: importer
        run: |
          node sanitize.js
          node quality-v2.js
          node quality-v3.js
          node quality-v4.js
          npm run merge
      - name: Ergebnis erneut testen
        working-directory: importer
        run: npm test
      - name: Hinweis
        run: echo 'Diagnosemodus abgeschlossen. Produktionsdaten werden von diesem Workflow nicht committed.'
