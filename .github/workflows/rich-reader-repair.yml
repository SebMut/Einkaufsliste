name: Spezialreader HIT Kaufland NORMA Lidl

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rich-reader-repair.yml'
      - 'importer/rich-retailers.js'

permissions:
  contents: write

concurrency:
  group: rich-reader-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencies
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Chromium
        working-directory: importer
        run: npx playwright install --with-deps chromium
      - name: Spezialreader
        working-directory: importer
        shell: bash
        run: |
          set -o pipefail
          node rich-retailers.js 2>&1 | tee ../data/rich-reader.log
      - name: Qualität 1
        working-directory: importer
        run: node sanitize.js
      - name: Qualität 2
        working-directory: importer
        run: node quality-v2.js
      - name: Ergebnis
        shell: bash
        run: |
          node - <<'NODE' | tee -a data/rich-reader.log
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/offers-live.json','utf8'));
          for(const store of ['HIT','Kaufland','NORMA','Lidl']){
            const s=(d.sources||[]).find(x=>x.store===store);
            console.log(`${store}: ${s?.status||'-'} / ${s?.count||0} / ${s?.message||''}`);
          }
          console.log(`Gesamt: ${d.offerCount}`);
          NODE
      - name: Veröffentlichen
        shell: bash
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers-live.json data/quality-report.json data/rich-reader.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Spezialreader-Angebote aktualisieren"
          git pull --rebase origin main
          git push origin main
