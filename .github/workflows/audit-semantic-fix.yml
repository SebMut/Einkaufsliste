name: Einmaliger Semantikfix

on:
  push:
    paths:
      - '.github/workflows/audit-semantic-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

# Dieser Workflow dient nur der gezielten, getesteten Korrektur des gefundenen Edge-Cases.
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Semantikregel gezielt korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('importer/semantic-products.js')
          s=p.read_text()
          old=r"/spülmaschinen(?:tabs?|tabletten)|geschirrspül(?:tabs?|tabletten)|spülmaschinentabs?/"
          new=r"/spülmaschinen\s*(?:tabs?|tabletten)|geschirrspül\s*(?:tabs?|tabletten)|spülmaschinentabs?/"
          if old not in s:
              raise SystemExit('Erwartete Semantikregel nicht gefunden; keine unsichere Änderung durchgeführt.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Gesamte Test-Suite ausführen
        working-directory: importer
        run: npm test
      - name: Korrektur committen
        run: |
          git config user.name "AngebotsRadar Test Bot"
          git config user.email "actions@users.noreply.github.com"
          git add importer/semantic-products.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Getrennt geschriebene Spülmaschinen-Tabs semantisch erkennen"
          git pull --rebase origin main
          git push origin main
