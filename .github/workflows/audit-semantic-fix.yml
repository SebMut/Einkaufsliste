name: Einmaliger Semantikfix Butter

on:
  push:
    paths:
      - '.github/workflows/audit-semantic-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Butter-Komposita korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('importer/semantic-products.js')
          s=p.read_text()
          old=r"/\bbutter\b|markenbutter|streichzart/"
          new=r"/\bbutter\b|markenbutter|süßrahmbutter|sauerrahmbutter|streichzart/"
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('Erwartete Butter-Regel nicht gefunden.')
          PY
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Gesamte Test-Suite ausführen
        working-directory: importer
        run: npm test
      - name: Korrektur committen
        run: |
          git config user.name "AngebotsRadar Test Bot"
          git config user.email "actions@users.noreply.github.com"
          git add importer/semantic-products.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Süßrahm- und Sauerrahmbutter semantisch erkennen"
          git pull --rebase origin main
          git push origin main
