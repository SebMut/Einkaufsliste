name: Lidl PDF Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/lidl-pdf-probe.sh'
      - '.github/workflows/lidl-pdf-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: PDF Textlayer prüfen
        run: bash tools/lidl-pdf-probe.sh
      - name: Publish
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lidl-pdf-probe.log
          git commit -m "Lidl PDF Probe aktualisieren" || exit 0
          git pull --rebase origin main
          git push origin main
