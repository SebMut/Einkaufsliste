name: ALDI Vollsortiment Probe
on:
  push:
    paths:
      - '.github/workflows/aldi-full-probe.yml'
      - 'importer/aldi-catalog-full-import.js'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: importer
        run: npm install --no-audit --no-fund
      - working-directory: importer
        run: node aldi-catalog-full-import.js
      - name: Katalog veröffentlichen
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog/aldi-sued.json data/catalog/index.json
          git commit -m "ALDI SÜD Vollsortiment aktualisieren [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
