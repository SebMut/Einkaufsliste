name: Lidl Tabellenreader Schnelltest
on:
  workflow_dispatch:
  push:
    paths:
      - 'importer/lidl-table-reader.js'
      - '.github/workflows/lidl-table-fast.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lidl Tabellenreader
        working-directory: importer
        run: node lidl-table-reader.js
      - name: Qualität
        working-directory: importer
        run: |
          node sanitize.js
          node quality-v2.js
          node quality-v3.js
          node quality-v4.js
      - name: Publish
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers-live.json data/quality-report.json data/lidl-table.log
          git commit -m "Lidl Tabellenangebote aktualisieren" || exit 0
          git pull --rebase origin main
          git push origin main
