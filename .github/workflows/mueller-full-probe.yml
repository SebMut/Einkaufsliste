name: MÜLLER Vollsortiment Probe
on:
  push:
    paths:
      - '.github/workflows/mueller-full-probe.yml'
      - 'importer/mueller-catalog-full-import.js'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: importer
        run: npm install --no-audit --no-fund
      - working-directory: importer
        run: node mueller-catalog-full-import.js
      - run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog/mueller.json data/catalog/index.json
          git commit -m "MÜLLER Vollsortiment aktualisieren [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
