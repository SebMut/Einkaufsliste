name: Grundlebensmittel integrieren

on:
  workflow_dispatch:
  push:
    paths:
      - 'grundlebensmittel.html'
      - 'data/staples.json'
      - 'importer/staples-matcher.js'
      - 'importer/staples-matcher.test.js'
      - 'importer/staples-e2e.js'
      - 'scripts/add-staples-link.mjs'
      - '.github/workflows/staples-ui.yml'

permissions:
  contents: write

concurrency:
  group: staples-ui
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Navigation integrieren
        run: node scripts/add-staples-link.mjs
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Vollständige Testsuite
        id: unit
        working-directory: importer
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../staples-unit.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Chromium installieren
        if: steps.unit.outputs.exit_code == '0'
        working-directory: importer
        run: npx playwright install --with-deps chromium
      - name: Grundlebensmittel auf Desktop und iPhone testen
        id: e2e
        if: steps.unit.outputs.exit_code == '0'
        working-directory: importer
        shell: bash
        run: |
          set +e
          node staples-e2e.js 2>&1 | tee ../staples-e2e.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Grundlebensmittel-Seite statisch prüfen
        id: static
        shell: bash
        run: |
          set +e
          grep -q 'Unsere Grundlebensmittel' grundlebensmittel.html && \
          grep -q 'data/staples.json' grundlebensmittel.html && \
          grep -q 'data-staples-nav="1"' index.html && \
          grep -q 'Andechser Bio-Milch in der Glasflasche' data/staples.json && \
          grep -q 'Adelholzener Mineralwasser' data/staples.json && \
          grep -q 'Alkoholfreies Bier' data/staples.json && \
          grep -q 'Halloumi' data/staples.json
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Testquittung erzeugen
        if: always()
        env:
          UNIT: ${{ steps.unit.outputs.exit_code }}
          E2E: ${{ steps.e2e.outputs.exit_code }}
          STATIC: ${{ steps.static.outputs.exit_code }}
        run: |
          mkdir -p docs
          node - <<'NODE'
          const fs=require('fs');
          const unit=Number(process.env.UNIT||99),e2e=Number(process.env.E2E||99),stat=Number(process.env.STATIC||99);
          const receipt={schema:1,generatedAt:new Date().toISOString(),testedCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,unitExitCode:unit,e2eExitCode:e2e,staticExitCode:stat,status:unit===0&&e2e===0&&stat===0?'passed':'failed'};
          fs.writeFileSync('docs/staples-test-results.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          test -f staples-unit.log && cp staples-unit.log docs/staples-unit.log || true
          test -f staples-e2e.log && cp staples-e2e.log docs/staples-e2e.log || true
      - name: Integration und Testquittung veröffentlichen
        if: always()
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html docs/staples-test-results.json docs/staples-unit.log docs/staples-e2e.log 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Grundlebensmittel-Integration und Testquittung aktualisieren [skip ci]"
          git pull --rebase origin main
          git push origin main
      - name: Gesamtstatus bewerten
        if: always()
        run: |
          test "${{ steps.unit.outputs.exit_code }}" = "0"
          test "${{ steps.e2e.outputs.exit_code }}" = "0"
          test "${{ steps.static.outputs.exit_code }}" = "0"
