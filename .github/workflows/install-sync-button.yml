name: Install Sync Button

on:
  push:
    paths:
      - '.github/workflows/install-sync-button.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync-Button in index.html einbauen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n.syncActions{display:flex;align-items:center;gap:8px}.syncBtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--green);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;white-space:nowrap}.syncBtn:active{transform:scale(.98)}\n@media(max-width:640px){.syncActions .ver{display:none}.syncBtn{padding:9px 11px;font-size:12px}}\n'''
          if '.syncBtn{' not in s:
              s=s.replace('</style>', css+'</style>')
          old='<header><div class="brand"><div class="logo">🛒</div><div><b>AngebotsRadar</b><small>Feldkirchen · Heimstetten · Aschheim · Kirchheim · Riem Arcaden</small></div></div><span class="ver">V5.1 · strikt lokal</span></header>'
          new='<header><div class="brand"><div class="logo">🛒</div><div><b>AngebotsRadar</b><small>Feldkirchen · Heimstetten · Aschheim · Kirchheim · Riem Arcaden</small></div></div><div class="syncActions"><a class="syncBtn" href="https://github.com/SebMut/Einkaufsliste/actions/workflows/full-database-refresh.yml" target="_blank" rel="noopener" title="Kompletten Datenbank-Refresh in GitHub Actions starten">🔄 Sync starten</a><span class="ver">V5.1 · strikt lokal</span></div></header>'
          if old in s:
              s=s.replace(old,new)
          elif 'class="syncBtn"' not in s:
              raise SystemExit('Header-Muster nicht gefunden – Abbruch ohne Änderung')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "AngebotsRadar UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sync-Button bereits vorhanden."
            exit 0
          fi
          git commit -m "Sync-Button auf Startseite einbauen [skip ci]"
          git push origin main
