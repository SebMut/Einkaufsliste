name: Vollsortiment-Quellen prüfen V2
on:
  push:
    paths:
      - '.github/workflows/catalog-source-probe-v2.yml'
      - 'importer/catalog-source-probe-v2.js'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: importer
        run: npm install --no-audit --no-fund
      - working-directory: importer
        run: node catalog-source-probe-v2.js
      - name: Ergebnis veröffentlichen
        run: |
          git config user.name "AngebotsRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalog-source-probe-v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vollsortiment-Quellenprobe aktualisieren [skip ci]"
          git pull --rebase origin main
          git push origin main
