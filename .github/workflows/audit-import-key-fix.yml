name: Einmaliger Rohimport-Semantikfix

on:
  push:
    paths:
      - '.github/workflows/audit-import-key-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Windelbeutel bereits im Rohimport von Windeln trennen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('importer/import.js')
          s=p.read_text()
          old="  ['Windeln', /\\bwindel(?:n|hose|beutel)?\\b|pants\\b|pull[- ]?ups?\\b/i],"
          new="  ['Windelbeutel', /\\bwindelbeutel\\b/i],\n  ['Windeln', /\\bwindeln?\\b|windelhose|\\bpants\\b|pull[- ]?ups?\\b/i],"
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('Erwartete Windel-Key-Regel nicht gefunden; keine unsichere Änderung.')
          PY
      - name: Abhängigkeiten installieren
        working-directory: importer
        run: npm install --no-audit --no-fund
      - name: Gesamte Regression-Suite ausführen
        working-directory: importer
        run: npm test
      - name: Korrektur committen
        run: |
          git config user.name "AngebotsRadar Test Bot"
          git config user.email "actions@users.noreply.github.com"
          git add importer/import.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Windelbeutel bereits im Rohimport von Windeln trennen"
          git pull --rebase origin main
          git push origin main
